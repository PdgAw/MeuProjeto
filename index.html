<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1A2B" />
    <meta name="description" content="Plataforma oficial da NeoLevel Business School." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>NeoLevel Business School</title>
    <script>
      // Apply the saved theme before first paint (dark is the brand default).
      try {
        if (localStorage.getItem('neolevel:theme') === 'light') {
          document.documentElement.classList.add('light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F3F6FA')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
